
name: Build HSEE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3.10 python3.10-dev python3.10-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"
          yes | sdkmanager --licenses
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 Cython==0.29.36

      - name: Connect Buildozer to the installed Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          ln -s "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"
          echo "ANDROIDSDK=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -l "$HOME/.buildozer/android/platform/android-sdk"
          ls "$HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl"

      - name: Show build environment
        run: |
          python --version
          java -version
          sdkmanager --list_installed

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSEE-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
